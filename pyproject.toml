[project]
name = "flypse"
version = "0.1.0"
description = "Federated Learning framework based on ECLYPSE"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]

authors = [
    { name = "Valerio De Caro", email = "valerio@valeriodecaro.com" },
    { name = "Jacopo Massa", email = "jacopo.massa@di.unipi.it" }
]

maintainers = [
    { name = "Valerio De Caro", email = "valerio@valeriodecaro.com" },
    { name = "Jacopo Massa", email = "jacopo.massa@di.unipi.it" }
]

dependencies = [
    "eclypse>=0.9.0",
    "numpy>=1.26",
    "ray[default]>=2.59.0",
]

[project.urls]
Homepage = "https://github.com/eclypse-org/flypse"
Repository = "https://github.com/eclypse-org/flypse"
Documentation = "https://flypse.readthedocs.io/en/latest/"
Changelog = "https://github.com/eclypse-org/flypse/blob/main/CHANGELOG.md"


# Dependency Groups
[dependency-groups]
dev = [
    "commitizen>=4.18.0",
    "isort>=9.0.0",
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "ruff>=0.16.4",
]

test = [
    "polars>=2.0.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
    "tensorboardx>=2.6.5",
]

docs = [
    "jinja2>=3.1.6",
    "myst-parser>=5.1.0",
    "pydata-sphinx-theme>=0.22.0",
    "sphinx>=9.0.4",
    "sphinx-autobuild>=2025.8.25",
    "sphinx-copybutton>=0.5.2",
    "sphinx-design>=0.7.0",
    "sphinx-favicon>=1.1.0",
    "sphinx-icon>=0.2.2",
]

# Build backend
[build-system]
requires = ["uv_build>=0.13.5,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "."
module-name = "flypse"

[tool.uv]
required-version = ">=0.13"


# -------------------------
# Third-party tool settings
# -------------------------

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "uv"
tag_format = "$version"
bump_message = "chore(release): bump version $current_version → $new_version"
update_changelog_on_bump = true
version_files = [
    "pyproject.toml:^version",
    "flypse/__init__.py:__version__",
    "CITATION.cff:version",
]


[tool.ruff]
include = ["flypse/**/*.py", "tests/**/*.py"]
extend-exclude = ["docs", "examples"]

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    # "I", # isort works better so far
    "B",
    "UP",
    "SIM",
    "C90",
    "RUF",
    "TCH",
    "PL",
    "ARG",
    "D",
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 20
max-locals = 30
max-branches = 15
max-positional-args = 20

[tool.ruff.lint.pycodestyle]
max-doc-length = 100

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-type-checking]
strict = true

[tool.ruff.lint.flake8-tidy-imports]
banned-module-level-imports = ["ray", "tensorboardX"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "D",
    "ARG005",
    "B018",
    "C901",
    "PLR0915",
    "PLR1711",
    "PLR2004",
    "PLW0108",
    "RUF012",
    "RUF100",
    "TC003",
    "UP037",
]

[tool.isort]
profile = "black"
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 2
filter_files = true
skip = ["__init__.py"]

[tool.mypy]
python_version = "3.11"

[[tool.mypy.overrides]]
module = [
    "ray",
    "ray.*",
    "polars",
    "polars.*",
    "tensorboardX",
    "networkx",
    "networkx.*",
    "pandas",
    "pandas.*",
    "numpy",
    "numpy.*",
    "loguru",
    "loguru.*",
    "eclypse",
    "eclypse.*",
]
ignore_missing_imports = true

# --------------------------
# Pytest and Coverage settings
# --------------------------

#

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov --cov-report=xml --cov-report=term-missing -n auto"
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]
markers = [
    "integration: end-to-end integration tests",
    "emulation: ray-backed remote integration tests",
    "optional: tests that exercise optional dependencies",
]

[tool.coverage.run]
branch = true
source = ["flypse"]

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_also = [
    "if TYPE_CHECKING:",
    "@abstractmethod",
    "raise NotImplementedError",
]
